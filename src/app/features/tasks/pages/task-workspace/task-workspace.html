<div>
  <p>Total tasks: {{ taskStore.stats().total }}</p>
  <p>Completed: {{ taskStore.stats().done }}</p>
  <p>Completion rate: {{ taskStore.stats().completionRate }}%</p>
  <button type="button" (click)="openTaskDialog()">Add task</button>
  <app-task-filters
    [query]="taskStore.taskQuery()"
    (searchChange)="taskStore.setSearch($event)"
    (statusChange)="taskStore.setStatus($event)"
    (priorityChange)="taskStore.setPriority($event)"
    (sortChange)="taskStore.setSort($event.field, $event.direction)"
  />
  <app-task-list [tasks]="taskStore.visibleTasks()" (deleteTask)="taskStore.deleteTask($event)" />
  <app-task-dialog
    [isOpen]="isTaskDialogOpen()"
    (closeRequested)="closeTaskDialog()"
    (createTask)="onCreateTask($event)"
  />
</div>
