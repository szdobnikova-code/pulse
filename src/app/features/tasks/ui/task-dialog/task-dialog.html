<dialog #dialog (close)="closeRequested.emit()">
  <h2>{{ task() ? 'Edit task' : 'Create task' }}</h2>

  @if (isOpen()) {
    <app-task-form
      [task]="task()"
      (createTask)="createTask.emit($event)"
      (updateTask)="updateTask.emit($event)"
    />
  }

  <button type="button" (click)="closeRequested.emit()">Cancel</button>
</dialog>
