<dialog #dialog class="confirm-dialog" (close)="cancelled.emit()">
  <div class="confirm-dialog__header">
    <span class="confirm-dialog__icon">
      <ng-icon name="lucideTriangleAlert" size="22" />
    </span>

    <button type="button" class="dialog-close" aria-label="Close dialog" (click)="cancelled.emit()">
      <ng-icon name="lucideX" size="20" />
    </button>
  </div>

  <h2 class="confirm-dialog__title">{{ title() }}</h2>

  <p class="confirm-dialog__message">{{ message() }}</p>

  <div class="confirm-dialog__footer">
    <button #cancelButton class="confirm-dialog__cancel" type="button" (click)="cancelled.emit()">
      Cancel
    </button>
    <button class="confirm-dialog__confirm" type="button" (click)="confirmed.emit()">
      {{ confirmLabel() }}
    </button>
  </div>
</dialog>
